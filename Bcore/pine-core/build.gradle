apply plugin: 'com.android.library'

android {
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion "36.1.0"
    namespace "top.canyie.pine"

    defaultConfig {
        minSdk 26
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        consumerProguardFiles 'consumer-rules.pro'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
                abiFilters 'arm64-v8a'
                targets 'pine'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Java 11 required by utils/HiddenApiBypass* (synced from org.lsposed.hiddenapibypass)
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    ndkVersion "29.0.14206865"

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "4.1.2"
        }
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/**'
            excludes += '/*.properties'
        }
    }

    buildFeatures {
        prefab true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'org.lsposed.libcxx:libcxx:29.0.14206865'
    // Compile-time stubs for sun.misc.Unsafe / dalvik.system.VMRuntime, never shipped
    compileOnly files('stub-libs/runtime-stubs.jar')
}