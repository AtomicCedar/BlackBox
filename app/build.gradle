plugins {
    id 'com.android.application'
}

// release 签名参数放在根目录 keystore.properties（已 gitignore，不入库）
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion "36.1.0"
    namespace 'top.niunaijun.blackbox.ui'

    defaultConfig {
        applicationId "top.niunaijun.blackbox"
        minSdk 26
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 16
        versionName "2.3.1"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                // storeFile 相对路径按 app 模块目录解析（../zitan.jks 即项目根目录）
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        // 新版 AndroidX（lifecycle 2.11 / activity 1.13 等）inline 函数按 JVM 11 编译，须同步
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable += ['UnusedResources', 'RestrictedApi']
    }
}

// AGP9 内置 Kotlin：Kotlin 编译目标与 Java 对齐 JVM 11
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation project(':Bcore')

    //android（官方活跃维护库，升到最新稳定版；2026-10 核对）
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation "androidx.activity:activity-ktx:1.13.0"
    implementation "androidx.fragment:fragment-ktx:1.9.1"
    implementation "androidx.preference:preference-ktx:1.2.1"

    //coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    //viewModel liveData  lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"


    //third

    //viewPager2 指示点（5.x 用 Kotlin 2.4 编译，AGP9 内置编译器 2.2 读不了，维持 4.2）
    implementation 'com.tbuonomo:dotsindicator:4.2'
    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    implementation 'com.afollestad.material-dialogs:input:3.3.0'
    //dialog
    implementation 'com.github.nukc.stateview:kotlin:2.2.0'
    //状态控制控件
    implementation 'com.roger.catloadinglibrary:catloadinglibrary:1.0.9'
    //加载dialog
    implementation 'com.github.Ferfalk:SimpleSearchView:0.2.0'
    //searchView
    implementation 'com.github.Othershe:CornerLabelView:1.0.0'
    //图标角标

    //adapter
    implementation 'com.gitee.cbfg5210:RVAdapter:0.3.7'
}
